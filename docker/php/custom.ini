; Konfigurasi PHP untuk Media Streamer (upload video + konversi HLS)
upload_max_filesize = 2G
post_max_size = 2G
max_file_uploads = 20
max_execution_time = 600
max_input_time = 600
memory_limit = 512M

date.timezone = UTC

opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 1
