name: media-streamer

services:
  app:
    build:
      context: .
      args:
        COMPOSER_NO_DEV: "1"
    image: media-streamer:latest
    container_name: media-streamer-app
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      CI_ENVIRONMENT: ${CI_ENVIRONMENT:-production}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080/}
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:-streaming_db}
      DB_USERNAME: ${DB_USERNAME:-streamer}
      DB_PASSWORD: ${DB_PASSWORD:-}
      DB_DRIVER: ${DB_DRIVER:-MySQLi}
      HLS_ENABLED: ${HLS_ENABLED:-true}
      HLS_FFMPEG_PATH: ${HLS_FFMPEG_PATH:-/usr/bin/ffmpeg}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-false}
      WAIT_FOR_DB: ${WAIT_FOR_DB:-true}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - writable_data:/var/www/html/writable
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  writable_data:
    name: media-streamer-writable
